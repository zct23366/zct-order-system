<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      iPad 等比缩放脚本：
      检测到平板尺寸（768–1279 CSS px）时，按 FIT_WIDTH 排版并计算 initial-scale，
      让 PC 布局完整铺满屏幕；平板上默认放大到 120%（FIT_WIDTH = 1280 / 1.2）。
      手机 (<768px) 和桌面 (≥1280px) 保持原始响应式 viewport。
    -->
    <script>
      (function () {
        var DESIGN_WIDTH = 1280;                       // PC 布局的设计宽度
        var ZOOM = 1.2;                                // 平板默认放大倍数
        var FIT_WIDTH = Math.round(DESIGN_WIDTH / ZOOM); // 1067：放大 1.2 倍后能放下 1280 画面的宽度
        var meta = document.querySelector('meta[name="viewport"]');

        // 真实视口尺寸：脚本执行时 meta 还是 device-width，此刻读到的就是设备的 CSS 像素尺寸。
        // 不要用 screen.width —— 部分 iPad / 安卓平板返回的是物理像素（例如 1546 而不是 880），
        // 比例会被算成 1.2 以上、夹在上限，版面溢出屏幕、右侧内容被切掉。只取一次，之后换向直接交换。
        var devW = 0, devH = 0, primed = false;

        function primeDeviceSize() {
          if (primed) return;
          var w = document.documentElement.clientWidth || window.innerWidth;
          var h = document.documentElement.clientHeight || window.innerHeight;
          if (!w || !h) return;                        // 解析阶段偶发取不到，等下一次
          devW = w; devH = h; primed = true;
        }

        function applyScale() {
          primeDeviceSize();
          if (!primed) return;
          var shortSide = Math.min(devW, devH);

          if (shortSide >= 768 && shortSide < DESIGN_WIDTH) {
            // 平板：按 FIT_WIDTH 排版，放大到 120% 后正好铺满屏幕
            var scale = Math.min(devW / FIT_WIDTH, ZOOM).toFixed(4);
            meta.setAttribute(
              'content',
              'width=' + FIT_WIDTH +
              ', initial-scale=' + scale +
              ', minimum-scale=0.1' +
              ', maximum-scale=5' +
              ', viewport-fit=cover'
            );
          } else {
            // 手机 / 桌面：正常响应式
            meta.setAttribute(
              'content',
              'width=device-width, initial-scale=1, viewport-fit=cover'
            );
          }
        }

        applyScale();
        window.addEventListener('resize', function () { setTimeout(applyScale, 50); });
        window.addEventListener('orientationchange', function () {
          var t = devW; devW = devH; devH = t;         // 换向：长宽互换，不重新测量
          setTimeout(applyScale, 120);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
