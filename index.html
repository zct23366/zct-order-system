<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      ── iPadOS 无边框独立运行 ──
      「添加到主屏幕」后网页以独立窗口启动：没有地址栏、标签栏和工具栏，画面铺满整块屏幕。
      display: standalone 由 manifest 声明（Safari 16.4+ 认），下面几条 Apple 专有 meta 负责老版本；
      status-bar-style 取 black-translucent，状态栏直接浮在内容上，页面四边到边。
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="自助点餐" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="自助点餐" />
    <meta name="theme-color" content="#0D0905" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      启动图：独窗启动时 iOS 先显示这张图再切到页面，缺了就是一段白屏。
      文件名即像素尺寸，媒体查询必须与设备完全对上（device-width/height 用 CSS 像素 + 2 倍屏）。
      重新生成：node scripts/generate-pwa-assets.mjs
    -->
    <link rel="apple-touch-startup-image" href="/splash/ipad-2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-2732x2048.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-1668x2420.png" media="(device-width: 834px) and (device-height: 1210px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-2420x1668.png" media="(device-width: 834px) and (device-height: 1210px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-2388x1668.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-1640x2360.png" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-2360x1640.png" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-1620x2160.png" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-2160x1620.png" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-1536x2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-2048x1536.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-1488x2266.png" media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ipad-2266x1488.png" media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />

    <!--
      独立窗口标记：必须在首帧之前把结果写到 <html> 上，CSS 才能一次用对安全区内边距，
      不会先按浏览器布局闪一下再跳。iOS 的独窗标志是 navigator.standalone，
      其他浏览器看 display-mode 媒体查询。iPadOS 13 起 Safari 的 UA 伪装成 macOS，
      靠「Macintosh + 多点触控」这两个特征单独判一次。
    -->
    <script>
      (function () {
        var ua = navigator.userAgent;
        var fakeMac = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
        var ios = /iPad|iPhone|iPod/.test(ua) || fakeMac;
        var mq = window.matchMedia;
        var standalone =
          navigator.standalone === true ||
          (mq && mq('(display-mode: standalone)').matches) ||
          (mq && mq('(display-mode: fullscreen)').matches) ||
          (mq && mq('(display-mode: minimal-ui)').matches);
        var root = document.documentElement;
        if (ios) root.classList.add('is-ios');
        if (standalone) root.classList.add('is-standalone');
      })();
    </script>

    <!--
      iPad 等比缩放脚本：
      检测到平板尺寸（768–1279 CSS px）时，按 FIT_WIDTH 排版并计算 initial-scale，
      让 PC 布局完整铺满屏幕；平板上默认放大到 120%（FIT_WIDTH = 1280 / 1.2）。
      手机 (<768px) 和桌面 (≥1280px) 保持原始响应式 viewport。
    -->
    <script>
      (function () {
        var DESIGN_WIDTH = 1280;                       // PC 布局的设计宽度
        var ZOOM = 1.2;                                // 平板默认放大倍数
        var FIT_WIDTH = Math.round(DESIGN_WIDTH / ZOOM); // 1067：放大 1.2 倍后能放下 1280 画面的宽度
        var meta = document.querySelector('meta[name="viewport"]');

        // 真实视口尺寸：脚本执行时 meta 还是 device-width，此刻读到的就是设备的 CSS 像素尺寸。
        // 不要用 screen.width —— 部分 iPad / 安卓平板返回的是物理像素（例如 1546 而不是 880），
        // 比例会被算成 1.2 以上、夹在上限，版面溢出屏幕、右侧内容被切掉。只取一次，之后换向直接交换。
        var devW = 0, devH = 0, primed = false;

        function primeDeviceSize() {
          if (primed) return;
          var w = document.documentElement.clientWidth || window.innerWidth;
          var h = document.documentElement.clientHeight || window.innerHeight;
          if (!w || !h) return;                        // 解析阶段偶发取不到，等下一次
          devW = w; devH = h; primed = true;
        }

        function applyScale() {
          primeDeviceSize();
          if (!primed) return;
          var shortSide = Math.min(devW, devH);

          if (shortSide >= 768 && shortSide < DESIGN_WIDTH) {
            // 平板：按 FIT_WIDTH 排版，放大到 120% 后正好铺满屏幕
            var scale = Math.min(devW / FIT_WIDTH, ZOOM).toFixed(4);
            meta.setAttribute(
              'content',
              'width=' + FIT_WIDTH +
              ', initial-scale=' + scale +
              ', minimum-scale=0.1' +
              ', maximum-scale=5' +
              ', viewport-fit=cover'
            );
          } else {
            // 手机 / 桌面：正常响应式
            meta.setAttribute(
              'content',
              'width=device-width, initial-scale=1, viewport-fit=cover'
            );
          }
        }

        applyScale();
        window.addEventListener('resize', function () { setTimeout(applyScale, 50); });
        window.addEventListener('orientationchange', function () {
          var t = devW; devW = devH; devH = t;         // 换向：长宽互换，不重新测量
          setTimeout(applyScale, 120);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
